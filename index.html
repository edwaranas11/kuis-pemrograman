<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuis PPLG - Multi Topik</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f7f9;
      color: #333;
    }
    header {
      text-align: center;
      padding: 20px;
      background-color: #1e3a8a;
      color: white;
    }
    header img {
      width: 80px;
      margin-bottom: 10px;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      color: #1e3a8a;
    }
    .question {
      margin-bottom: 20px;
    }
    .options label {
      display: block;
      padding: 10px;
      border: 1px solid #ccc;
      margin-bottom: 5px;
      border-radius: 5px;
      cursor: pointer;
      background-color: #f9f9f9;
      transition: background 0.2s;
    }
    .options label:hover {
      background-color: #e0e7ff;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background-color: #1e3a8a;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #3749a2;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background-color: #d1fae5;
      border-left: 5px solid #10b981;
      border-radius: 5px;
      display: none;
    }
    .correct {
      background-color: #d1fae5;
      border-color: #10b981;
    }
    .incorrect {
      background-color: #fee2e2;
      border-color: #ef4444;
    }
    .feedback {
      font-weight: bold;
      margin-top: 5px;
    }
    @media screen and (max-width: 600px) {
      .container {
        margin: 10px;
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://edwaranas11.github.io/soal-pplg1/LOGO%20SMK.png" alt="Logo Sekolah" />
    <h1>Kuis PPLG - Multi Topik</h1>
    <p>Oleh Edwar Anas, S.Kom</p>
  </header>

  <div class="container" id="quiz-container">
    <form id="quizForm"></form>
    <div class="result" id="resultBox"></div>
    <button type="button" onclick="submitQuiz()">Selesai</button>
    <button type="button" onclick="location.reload()" style="display: none;" id="retryBtn">Coba Lagi</button>
  </div>

  <script>
    const questions = [
      // 🌱 Green Technology
      { question: "1. Tujuan utama dari teknologi hijau (green technology) adalah…", options: ["Meningkatkan konsumsi energi", "Mengurangi dampak lingkungan", "Meningkatkan limbah industri", "Menghapus sumber daya alam"], answer: 1 },
      { question: "2. Contoh penerapan green technology di bidang transportasi adalah…", options: ["Mobil listrik", "Mobil balap", "Truk diesel", "Pesawat tempur"], answer: 0 },
      { question: "3. Panel surya mengubah energi matahari menjadi…", options: ["Energi listrik", "Energi panas bumi", "Energi angin", "Energi air"], answer: 0 },
      { question: "4. Teknologi daur ulang limbah plastik termasuk kategori…", options: ["Green technology", "Virtual reality", "Cloud computing", "Nanoteknologi"], answer: 0 },
      { question: "5. Salah satu manfaat penggunaan energi terbarukan adalah…", options: ["Mengurangi emisi karbon", "Menambah polusi udara", "Meningkatkan penggunaan batu bara", "Mengurangi efisiensi energi"], answer: 0 },

      // 🕶️ Virtual Reality & Augmented Reality
      { question: "6. Virtual Reality (VR) memungkinkan pengguna untuk…", options: ["Masuk ke lingkungan digital imersif", "Melihat dunia nyata tanpa perubahan", "Mengontrol komputer menggunakan suara", "Menulis kode program"], answer: 0 },
      { question: "7. Augmented Reality (AR) bekerja dengan cara…", options: ["Menambahkan elemen digital ke dunia nyata", "Menggantikan dunia nyata sepenuhnya", "Mencetak gambar 3D", "Menghapus objek nyata"], answer: 0 },
      { question: "8. Perangkat yang sering digunakan untuk VR adalah…", options: ["Headset VR", "Keyboard", "Printer", "Mouse"], answer: 0 },
      { question: "9. Contoh penerapan AR dalam pendidikan adalah…", options: ["Aplikasi anatomi 3D yang menampilkan organ tubuh manusia", "Mesin cetak 3D", "Permainan papan", "Presentasi PowerPoint"], answer: 0 },
      { question: "10. Teknologi AR banyak dimanfaatkan dalam industri…", options: ["Periklanan dan pelatihan teknis", "Pertanian tradisional", "Penulisan puisi", "Pengolahan makanan"], answer: 0 },

      // 💻 Pengembangan Perangkat Lunak
      { question: "11. Langkah pertama dalam pengembangan perangkat lunak adalah…", options: ["Analisis kebutuhan", "Pemrograman", "Pengujian", "Pemeliharaan"], answer: 0 },
      { question: "12. Model pengembangan perangkat lunak yang berurutan dari analisis hingga pemeliharaan disebut…", options: ["Waterfall", "Agile", "Scrum", "DevOps"], answer: 0 },
      { question: "13. Agile development menekankan pada…", options: ["Fleksibilitas dan kolaborasi tim", "Proses yang kaku", "Dokumentasi berlebihan", "Proyek tanpa umpan balik"], answer: 0 },
      { question: "14. Pengujian perangkat lunak (software testing) bertujuan untuk…", options: ["Menemukan kesalahan dan memastikan kualitas sistem", "Menambah ukuran file", "Memperlambat program", "Menghapus fitur"], answer: 0 },
      { question: "15. Versi kode sumber yang disimpan dan dikelola menggunakan sistem seperti Git disebut…", options: ["Version control", "Debugging", "Deployment", "Encryption"], answer: 0 },

      // 🔒 Keamanan Siber & Etika Digital
      { question: "16. Tujuan utama keamanan siber (cyber security) adalah…", options: ["Mengamankan data dan sistem dari ancaman digital", "Mempercepat koneksi internet", "Meningkatkan ukuran file", "Menghapus data lama"], answer: 0 },
      { question: "17. Contoh serangan siber yang mencuri data pribadi pengguna adalah…", options: ["Phishing", "Streaming", "Cloud backup", "SEO"], answer: 0 },
      { question: "18. Etika digital mengajarkan kita untuk…", options: ["Menghormati privasi dan menggunakan teknologi secara bertanggung jawab", "Mengunggah data pribadi sembarangan", "Menggunakan akun palsu untuk hiburan", "Menyebarkan informasi tanpa sumber"], answer: 0 },
      { question: "19. Salah satu cara melindungi akun online adalah…", options: ["Menggunakan kata sandi kuat dan autentikasi dua faktor", "Membagikan password ke teman", "Menggunakan password sama di semua akun", "Menonaktifkan firewall"], answer: 0 },
      { question: "20. Tindakan yang termasuk pelanggaran etika digital adalah…", options: ["Plagiarisme dan menyebarkan hoaks", "Memberi kredit kepada pembuat asli", "Menjaga keamanan data", "Menghormati hak cipta"], answer: 0 }
    ];

    const quizForm = document.getElementById("quizForm");
    questions.forEach((q, index) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h2>${q.question}</h2><div class="options">` +
        q.options.map((opt, i) => `
          <label>
            <input type="radio" name="q${index}" value="${i}"/> ${opt}
          </label>`).join("") +
        `</div><div class="feedback" id="feedback${index}"></div>`;
      quizForm.appendChild(div);
    });

    function submitQuiz() {
      const answers = questions.map((_, i) =>
        document.querySelector(`input[name="q${i}"]:checked`)
      );

      if (answers.includes(null)) {
        alert("Silakan jawab semua soal terlebih dahulu!");
        return;
      }

      let score = 0;
      answers.forEach((ans, i) => {
        const correct = questions[i].answer;
        const feedbackEl = document.getElementById(`feedback${i}`);
        const labels = document.querySelectorAll(`input[name="q${i}"]`);

        labels.forEach(input => {
          const label = input.closest("label");
          label.classList.remove("correct", "incorrect");
          if (parseInt(input.value) === correct) {
            label.classList.add("correct");
          }
        });

        if (parseInt(ans.value) === correct) {
          score++;
          feedbackEl.textContent = "✔ Benar";
          feedbackEl.style.color = "green";
        } else {
          feedbackEl.textContent = `✖ Salah. Jawaban yang benar: ${questions[i].options[correct]}`;
          feedbackEl.style.color = "red";
          ans.closest("label").classList.add("incorrect");
        }
      });

      const resultBox = document.getElementById("resultBox");
      resultBox.style.display = "block";
      resultBox.innerHTML = `<strong>Skor Kamu: ${score} / ${questions.length}</strong><br>Terus semangat belajar ya!`;

      document.querySelector("button[onclick='submitQuiz()']").style.display = "none";
      document.getElementById("retryBtn").style.display = "inline-block";
    }
  </script>
</body>
</html>
