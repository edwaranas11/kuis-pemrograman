<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuis PPLG - Logika & Java Dasar</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f7f9;
      color: #333;
    }
    header {
      text-align: center;
      padding: 20px;
      background-color: #1e3a8a;
      color: white;
    }
    header img {
      width: 80px;
      margin-bottom: 10px;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      color: #1e3a8a;
      font-size: 1.1rem;
    }
    .question {
      margin-bottom: 30px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }
    .options label {
      display: block;
      padding: 10px;
      border: 1px solid #ccc;
      margin-bottom: 5px;
      border-radius: 5px;
      cursor: pointer;
      background-color: #f9f9f9;
      transition: background 0.2s;
    }
    .options label:hover {
      background-color: #e0e7ff;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background-color: #1e3a8a;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #3749a2;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background-color: #d1fae5;
      border-left: 5px solid #10b981;
      border-radius: 5px;
      display: none;
    }
    .correct {
      background-color: #d1fae5 !important;
      border-color: #10b981 !important;
    }
    .incorrect {
      background-color: #fee2e2 !important;
      border-color: #ef4444 !important;
    }
    .feedback {
      font-weight: bold;
      margin-top: 5px;
    }
    @media screen and (max-width: 600px) {
      .container {
        margin: 10px;
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://edwaranas11.github.io/soal-pplg1/LOGO%20SMK.png" alt="Logo Sekolah" />
    <h1>Evaluasi Logika & Pemrograman Java</h1>
    <p>Oleh Edwar Anas, S.Kom</p>
  </header>

  <div class="container" id="quiz-container">
    <form id="quizForm"></form>
    <div class="result" id="resultBox"></div>
    <button type="button" onclick="submitQuiz()">Selesai & Cek Hasil</button>
    <button type="button" onclick="location.reload()" style="display: none;" id="retryBtn">Coba Lagi</button>
  </div>

  <script>
    const questions = [
      // BULAN 1: Logika & AI
      { question: "1. Teknik memecah masalah kompleks menjadi bagian-bagian yang lebih kecil disebut...", options: ["Abstraksi", "Dekomposisi", "Pengenalan Pola", "Algoritma"], answer: 1 },
      { question: "2. Perbedaan utama AI dengan program manual adalah AI mampu...", options: ["Bekerja tanpa listrik", "Belajar dari pola data", "Menghapus virus otomatis", "Mengganti hardware sendiri"], answer: 1 },
      { question: "3. Langkah-langkah logis dan sistematis untuk menyelesaikan masalah disebut...", options: ["Flowchart", "Variabel", "Algoritma", "Pseudocode"], answer: 2 },
      { question: "4. Simbol belah ketupat (diamond) pada flowchart berfungsi untuk...", options: ["Mulai/Selesai", "Proses", "Input/Output", "Keputusan/Percabangan"], answer: 3 },
      { question: "5. Penulisan algoritma yang menyerupai struktur kode pemrograman adalah...", options: ["Flowchart", "Pseudocode", "Narasi", "Puisi"], answer: 1 },
      
      // Minggu 3-4: Dasar Java
      { question: "6. Class Java yang digunakan untuk menerima input dari user adalah...", options: ["Scanner", "Input", "System", "Print"], answer: 0 },
      { question: "7. Manakah penulisan main method yang benar di Java?", options: ["void static main()", "public static void main(String[] args)", "public main(args)", "static void Main()"], answer: 1 },
      { question: "8. Tipe data yang digunakan untuk menyimpan angka bulat adalah...", options: ["double", "float", "String", "int"], answer: 3 },
      { question: "9. Jika ingin menyimpan teks seperti 'Nama Siswa', tipe data yang tepat adalah...", options: ["char", "String", "boolean", "int"], answer: 1 },
      { question: "10. Perintah untuk mencetak teks lalu pindah ke baris baru adalah...", options: ["System.out.print()", "System.out.println()", "System.in.read()", "System.out.write()"], answer: 1 },

      // BULAN 2: Struktur Kontrol
      { question: "11. Struktur kontrol yang digunakan untuk memilih satu dari dua kondisi (Ya/Tidak) adalah...", options: ["FOR", "WHILE", "IF-ELSE", "SWITCH"], answer: 2 },
      { question: "12. Operator logika 'AND' di Java dilambangkan dengan simbol...", options: ["||", "==", "&&", "!"], answer: 2 },
      { question: "13. Struktur IF di dalam IF disebut dengan istilah...", options: ["Multiple IF", "Nested IF", "Double IF", "Looping IF"], answer: 1 },
      { question: "14. Keyword yang digunakan pada SWITCH-CASE jika tidak ada nilai yang cocok adalah...", options: ["else", "break", "stop", "default"], answer: 3 },
      { question: "15. Apa fungsi 'break' dalam struktur SWITCH-CASE?", options: ["Menghentikan program", "Keluar dari blok switch agar tidak lanjut ke case bawahnya", "Memberikan nilai balik", "Memulai perulangan"], answer: 1 },
      { question: "16. Perulangan yang jumlah putarannya sudah ditentukan secara pasti sebaiknya menggunakan...", options: ["FOR", "WHILE", "DO-WHILE", "IF"], answer: 0 },
      { question: "17. Perulangan yang mengecek kondisi di akhir (minimal jalan 1x) adalah...", options: ["FOR", "WHILE", "DO-WHILE", "SWITCH"], answer: 2 },
      { question: "18. Apa yang terjadi jika kondisi WHILE selalu bernilai TRUE tanpa ada perubahan nilai?", options: ["Program error", "Infinite Loop (Perulangan tak henti)", "Program langsung selesai", "PC otomatis mati"], answer: 1 },
      { question: "19. Operator 'i++' dalam perulangan merupakan singkatan dari...", options: ["i = i + 1", "i = i - 1", "i = i * 2", "i = i / 2"], answer: 0 },
      { question: "20. Tipe data yang hanya memiliki nilai 'true' atau 'false' adalah...", options: ["int", "double", "boolean", "String"], answer: 2 }
    ];

    const quizForm = document.getElementById("quizForm");
    questions.forEach((q, index) => {
      const div = document.createElement("div");
      div.className = "question";
      div.innerHTML = `<h2>${q.question}</h2><div class="options">` +
        q.options.map((opt, i) => `
          <label>
            <input type="radio" name="q${index}" value="${i}"/> ${opt}
          </label>`).join("") +
        `</div><div class="feedback" id="feedback${index}"></div>`;
      quizForm.appendChild(div);
    });

    function submitQuiz() {
      const answers = questions.map((_, i) =>
        document.querySelector(`input[name="q${i}"]:checked`)
      );

      if (answers.includes(null)) {
        alert("Mohon jawab semua soal sebelum menekan tombol Selesai!");
        return;
      }

      let score = 0;
      answers.forEach((ans, i) => {
        const correct = questions[i].answer;
        const feedbackEl = document.getElementById(`feedback${i}`);
        const labels = document.querySelectorAll(`input[name="q${i}"]`);

        labels.forEach(input => {
          const label = input.closest("label");
          label.classList.remove("correct", "incorrect");
          if (parseInt(input.value) === correct) {
            label.classList.add("correct");
          }
        });

        if (parseInt(ans.value) === correct) {
          score++;
          feedbackEl.textContent = "✔ Benar!";
          feedbackEl.style.color = "#10b981";
        } else {
          feedbackEl.textContent = `✖ Salah. Jawaban benar: ${questions[i].options[correct]}`;
          feedbackEl.style.color = "#ef4444";
          ans.closest("label").classList.add("incorrect");
        }
      });

      const resultBox = document.getElementById("resultBox");
      resultBox.style.display = "block";
      const nilai = (score / questions.length) * 100;
      resultBox.innerHTML = `<strong>Hasil Akhir:</strong><br>Skor: ${score} / ${questions.length}<br>Nilai: ${nilai}<br><br><em>Terus semangat belajar koding ya!</em>`;

      document.querySelector("button[onclick='submitQuiz()']").style.display = "none";
      document.getElementById("retryBtn").style.display = "inline-block";
      
      // Scroll ke atas untuk lihat skor
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
  </script>
</body>
</html>
