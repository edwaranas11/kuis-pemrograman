<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi Logika & Pemrograman Java</title>
    <style>
        /* CSS - Desain Tampilan */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            background: white;
            width: 100%;
            max-width: 700px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        header {
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { color: #2c3e50; font-size: 1.4rem; margin: 0; }
        #progress { color: #3498db; font-weight: bold; font-size: 0.9rem; }

        .question-section h2 {
            font-size: 1.2rem;
            color: #34495e;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: #2c3e50;
        }

        .option-btn:hover {
            background-color: #e3f2fd;
            border-color: #3498db;
            transform: translateY(-2px);
        }

        .hidden { display: none; }

        #result-box {
            text-align: center;
            padding: 40px 20px;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .restart-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
        }

        .restart-btn:hover { background-color: #219150; }
    </style>
</head>
<body>

<div class="quiz-container">
    <header>
        <h1>Ujian Logika & Java</h1>
        <div id="progress">Soal 1 / 20</div>
    </header>

    <div id="quiz-box">
        <div class="question-section">
            <h2 id="question">Memuat pertanyaan...</h2>
        </div>
        <div id="options" class="options-grid"></div>
    </div>

    <div id="result-box" class="hidden">
        <h2>Hasil Evaluasi</h2>
        <div class="score-circle">
            <span id="final-score">0</span>
            <small>Skor</small>
        </div>
        <p id="stats-text"></p>
        <button class="restart-btn" onclick="location.reload()">Ulangi Kuis</button>
    </div>
</div>

<script>
    // DATA SOAL (20 Pertanyaan Lengkap)
    const quizData = [
        { q: "Dalam Computational Thinking, proses memecah masalah besar menjadi bagian kecil disebut...", options: ["Dekomposisi", "Abstraksi", "Algoritma", "Pola"], correct: 0 },
        { q: "Apa perbedaan utama program manual vs AI?", options: ["AI tidak pakai kode", "AI belajar dari data", "Manual lebih pintar", "AI hanya untuk robot"], correct: 1 },
        { q: "Simbol Belah Ketupat pada flowchart digunakan untuk...", options: ["Input", "Proses", "Keputusan/Percabangan", "Start/End"], correct: 2 },
        { q: "Cara penulisan algoritma menyerupai kode program disebut...", options: ["Pseudocode", "Flowchart", "Java", "Logika"], correct: 0 },
        { q: "Class yang digunakan untuk mengambil input keyboard di Java adalah...", options: ["System.in", "Scanner", "Input", "Printer"], correct: 1 },
        { q: "Manakah penulisan main method yang benar?", options: ["void main()", "public static void main(String[] args)", "static void Main()", "public main()"], correct: 1 },
        { q: "Tipe data untuk menyimpan angka desimal (koma) adalah...", options: ["int", "String", "double", "boolean"], correct: 2 },
        { q: "Apa fungsi dari System.out.println()?", options: ["Input data", "Cetak teks & baris baru", "Hapus data", "Simpan file"], correct: 1 },
        { q: "Java adalah bahasa yang Case-Sensitive, artinya...", options: ["Huruf besar/kecil berpengaruh", "Tidak boleh ada spasi", "Harus pakai titik koma", "Bahasa yang sensitif"], correct: 0 },
        { q: "Simbol operator logika 'DAN' (AND) di Java adalah...", options: ["||", "==", "&&", "!"], correct: 2 },
        { q: "Struktur IF-ELSE digunakan untuk...", options: ["Perulangan", "Percabangan/Pilihan", "Variabel", "Import"], correct: 1 },
        { q: "Apa kegunaan 'default' pada switch-case?", options: ["Memulai program", "Pilihan jika tidak ada case yang cocok", "Menghentikan loop", "Menghapus variabel"], correct: 1 },
        { q: "Nested IF adalah...", options: ["IF di dalam IF", "IF tanpa ELSE", "IF untuk angka saja", "IF yang salah"], correct: 0 },
        { q: "Operator 'i++' dalam perulangan berfungsi untuk...", options: ["Mengurangi nilai", "Menambah nilai sebanyak 1", "Mengalikan nilai", "Menghentikan loop"], correct: 1 },
        { q: "Perulangan yang sudah diketahui jumlah putarannya sebaiknya memakai...", options: ["For", "While", "Do-While", "If"], correct: 0 },
        { q: "Apa yang terjadi jika kondisi While selalu TRUE tanpa perubahan?", options: ["Program error", "Infinite Loop", "Program berhenti", "Layar hitam"], correct: 1 },
        { q: "Kapan Do-While melakukan pengecekan kondisi?", options: ["Di awal", "Di tengah", "Di akhir", "Tidak pernah"], correct: 2 },
        { q: "Simbol jajaran genjang di flowchart melambangkan...", options: ["Proses", "Input/Output", "Start", "Decision"], correct: 1 },
        { q: "Ekstensi file kode sumber Java adalah...", options: [".class", ".exe", ".java", ".js"], correct: 2 },
        { q: "Manakah contoh penerapan Abstraksi?", options: ["Fokus pada inti masalah", "Memecah kode", "Membuat urutan", "Mencari error"], correct: 0 }
    ];

    let currentIdx = 0;
    let score = 0;

    const qElement = document.getElementById('question');
    const optionsElement = document.getElementById('options');
    const progressElement = document.getElementById('progress');
    const quizBox = document.getElementById('quiz-box');
    const resultBox = document.getElementById('result-box');
    const finalScoreElement = document.getElementById('final-score');
    const statsText = document.getElementById('stats-text');

    function loadQuestion() {
        const currentQ = quizData[currentIdx];
        qElement.innerText = currentQ.q;
        progressElement.innerText = `Soal ${currentIdx + 1} / ${quizData.length}`;
        
        optionsElement.innerHTML = '';
        currentQ.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.classList.add('option-btn');
            btn.onclick = () => handleAnswer(index);
            optionsElement.appendChild(btn);
        });
    }

    function handleAnswer(selected) {
        if (selected === quizData[currentIdx].correct) {
            score++;
        }
        
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizBox.classList.add('hidden');
        resultBox.classList.remove('hidden');
        
        const finalScore = Math.round((score / quizData.length) * 100);
        finalScoreElement.innerText = finalScore;
        statsText.innerText = `Anda menjawab benar ${score} dari ${quizData.length} soal.`;
        
        document.querySelector('header h1').innerText = "Evaluasi Selesai";
        document.getElementById('progress').innerText = "";
    }

    // Mulai Kuis
    loadQuestion();
</script>

</body>
</html>
