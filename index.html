<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif: Logika & Pemrograman Java</title>
    <style>
        /* --- CSS: Tampilan & Desain --- */
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --success: #22c55e;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .quiz-card {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        h1 { font-size: 1.25rem; margin: 0; color: var(--primary); }
        #progress { font-weight: 600; font-size: 0.875rem; color: var(--secondary); }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .options-list {
            display: grid;
            gap: 0.75rem;
        }

        .btn-option {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 1rem;
            border-radius: 0.6rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-option:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .hidden { display: none; }

        /* --- Tampilan Hasil --- */
        #result-screen {
            text-align: center;
            padding: 1rem;
        }

        .score-box {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .status-msg {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: var(--secondary);
        }

        .btn-restart {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-restart:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="quiz-card">
        <header id="quiz-header">
            <h1>Evaluasi Belajar</h1>
            <span id="progress">Soal 1/20</span>
        </header>

        <div id="quiz-screen">
            <div class="question-text" id="question">Memuat pertanyaan...</div>
            <div class="options-list" id="options"></div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>Ujian Selesai!</h2>
            <div class="score-box" id="final-score">0</div>
            <p class="status-msg" id="status-text"></p>
            <button class="btn-restart" onclick="location.reload()">Coba Lagi</button>
        </div>
    </div>

    <script>
        // Data 20 Pertanyaan
        const database = [
            { q: "Membagi masalah besar menjadi bagian kecil agar mudah diselesaikan disebut...", a: ["Dekomposisi", "Abstraksi", "Algoritma", "Coding"], c: 0 },
            { q: "Perbedaan utama AI dibanding program biasa adalah...", a: ["Tidak butuh listrik", "Belajar dari data", "Lebih mahal", "Tidak butuh koding"], c: 1 },
            { q: "Simbol belah ketupat dalam flowchart melambangkan...", a: ["Mulai", "Proses", "Keputusan (Decision)", "Output"], c: 2 },
            { q: "Penulisan algoritma yang mirip bahasa pemrograman disebut...", a: ["Diagram", "Pseudocode", "Script", "Bahasa Gaul"], c: 1 },
            { q: "Simbol jajaran genjang di flowchart digunakan untuk...", a: ["Input/Output", "Proses", "Mulai", "Selesai"], c: 0 },
            { q: "Keyword Java untuk mengaktifkan fungsi input Scanner adalah...", a: ["include", "import", "package", "using"], c: 1 },
            { q: "Tipe data untuk menyimpan angka bulat (tanpa koma) adalah...", a: ["double", "String", "int", "boolean"], c: 2 },
            { q: "Tipe data untuk menyimpan teks/kalimat adalah...", a: ["char", "int", "float", "String"], c: 3 },
            { q: "Java bersifat Case-Sensitive, artinya...", a: ["Sensitif pada perasaan", "Huruf besar/kecil berpengaruh", "Hanya bisa di PC", "Tidak boleh ada angka"], c: 1 },
            { q: "Operator '&&' dalam logika pemrograman berarti...", a: ["ATAU", "TIDAK", "DAN", "SAMA DENGAN"], c: 2 },
            { q: "Struktur IF-ELSE digunakan jika program memiliki...", a: ["Banyak data", "Pilihan/Kondisi", "Kesalahan", "Kecepatan"], c: 1 },
            { q: "Switch-case paling cocok digunakan untuk...", a: ["Menu pilihan tetap", "Matematika rumit", "Membuat loop", "Hapus data"], c: 0 },
            { q: "Apa kegunaan 'break' dalam Switch-case?", a: ["Istirahat", "Menghentikan pengecekan berikutnya", "Menghapus program", "Memulai loop"], c: 1 },
            { q: "Nested IF artinya adalah...", a: ["IF di dalam IF", "IF yang salah", "IF tanpa ELSE", "IF satu baris"], c: 0 },
            { q: "Perulangan FOR digunakan jika...", a: ["Kondisi tidak jelas", "Jumlah putaran sudah pasti", "Ingin berhenti paksa", "Hanya untuk teks"], c: 1 },
            { q: "Apa dampak dari Infinite Loop?", a: ["PC makin cepat", "Program jalan terus tak berhenti", "Data terhapus", "Program otomatis update"], c: 1 },
            { q: "Perulangan yang mengecek kondisi di akhir adalah...", a: ["FOR", "WHILE", "DO-WHILE", "SWITCH"], c: 2 },
            { q: "Perintah cetak yang pindah ke baris baru adalah...", a: ["print()", "println()", "printf()", "output()"], c: 1 },
            { q: "Nama file Java harus sama dengan...", a: ["Nama Class", "Nama User", "Nama Project", "Nama Folder"], c: 0 },
            { q: "Fokus mengabaikan detail tidak penting disebut...", a: ["Pola", "Abstraksi", "Dekomposisi", "Logic"], c: 1 }
        ];

        let index = 0;
        let score = 0;

        const qBox = document.getElementById('question');
        const optBox = document.getElementById('options');
        const progress = document.getElementById('progress');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        function startQuiz() {
            const current = database[index];
            qBox.innerText = current.q;
            progress.innerText = `Soal ${index + 1}/${database.length}`;
            
            optBox.innerHTML = '';
            current.a.forEach((pilihan, i) => {
                const btn = document.createElement('button');
                btn.innerText = pilihan;
                btn.className = 'btn-option';
                btn.onclick = () => select(i);
                optBox.appendChild(btn);
            });
        }

        function select(pilihanUser) {
            if (pilihanUser === database[index].c) {
                score++;
            }
            
            index++;
            if (index < database.length) {
                startQuiz();
            } else {
                finish();
            }
        }

        function finish() {
            quizScreen.classList.add('hidden');
            document.getElementById('quiz-header').classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            const total = (score / database.length) * 100;
            document.getElementById('final-score').innerText = total;
            document.getElementById('status-text').innerText = `Benar: ${score} | Salah: ${database.length - score}`;
        }

        startQuiz();
    </script>
</body>
</html>
